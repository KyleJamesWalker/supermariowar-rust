apply plugin: 'com.android.application'

android {
    namespace 'net.smwstuff.supermariowar'
    compileSdkVersion 34
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'net.smwstuff.supermariowar'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode project.property('smwVersionCode') as int
        versionName project.property('smwVersionName')
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    lint {
        abortOnError false
    }
}
