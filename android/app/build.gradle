apply plugin: 'com.android.application'

android {
    namespace 'com.kylejameswalker.supermariowar'
    compileSdkVersion 34
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.kylejameswalker.supermariowar'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode project.property('smwVersionCode') as int
        versionName project.property('smwVersionName')
    }
    signingConfigs {
        debug {
            def keystore = System.getenv('SMW_DEBUG_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('SMW_DEBUG_KEYSTORE_PASSWORD')
                keyAlias 'smw-debug'
                keyPassword System.getenv('SMW_DEBUG_KEYSTORE_PASSWORD')
            }
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    packaging {
        jniLibs.useLegacyPackaging false
    }
    lint {
        abortOnError false
    }
}
