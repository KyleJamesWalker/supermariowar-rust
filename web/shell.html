<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Mario War</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="touch.css">
<script src="touch.js" defer></script>
<style>
  :root {
    --bg: #0e0f1a;
    --panel: #171a2b;
    --text: #e8e9f3;
    --muted: #8a8fb0;
    --accent: #e4002b;
    --accent-dark: #8c0019;
    --gold: #ffcc33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #22264a 0%, var(--bg) 60%) fixed;
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 14px;
    min-height: 100vh;
  }
  h1 {
    margin: 4px 0 0;
    font-size: clamp(20px, 3.2vw, 30px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--accent-dark);
  }
  .stage {
    position: relative;
    width: min(100%, calc((100vh - 190px) * 4 / 3), 1280px);
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 6px;
    box-shadow: 0 0 0 3px #000, 0 0 0 6px var(--panel), 0 18px 40px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }
  canvas.game {
    /* !important: SDL/Emscripten set inline pixel sizes on the canvas. */
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
    display: block;
    image-rendering: pixelated;
    outline: none;
  }
  .stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0, 0, 0, 0.85);
    font-weight: 600;
    text-align: center;
    padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .bar { width: 50%; height: 10px; background: #2a2e4a; border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--gold); transition: width 0.15s; }
  .toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 960px; }
  .btn {
    font: 700 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #fff;
    background: linear-gradient(var(--accent), #b80022);
    border: 0;
    border-radius: 8px;
    padding: 12px 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--accent-dark), 0 8px 16px rgba(0, 0, 0, 0.4);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.06s, box-shadow 0.06s, filter 0.15s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-dark), 0 4px 8px rgba(0, 0, 0, 0.4); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn svg { width: 18px; height: 18px; }
  .btn-big { font-size: 20px; padding: 16px 34px; }
  .btn-big svg { width: 22px; height: 22px; }
  .btn-quiet { background: var(--panel); box-shadow: 0 4px 0 #05060b, 0 8px 16px rgba(0, 0, 0, 0.4); }
  .btn[hidden] { display: none; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; }
  kbd {
    background: var(--panel);
    border: 1px solid #2f3459;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font: 12px ui-monospace, Menlo, monospace;
    color: var(--text);
    white-space: nowrap;
  }
  footer { margin-top: auto; color: var(--muted); font-size: 12px; text-align: center; }
  footer a { color: var(--muted); }
  footer a[hidden] { display: none; }
  #output {
    width: min(100%, 960px);
    height: 160px;
    background: #05060b;
    color: #9fe3a8;
    border: 1px solid #2a2e4a;
    border-radius: 6px;
    font: 12px ui-monospace, Menlo, monospace;
    padding: 8px;
  }
  #output[hidden] { display: none; }
</style>
</head>
<body>
  <h1>Super Mario War</h1>

  <div class="stage" id="stage">
    <canvas class="game" id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div class="overlay" id="loading">
      <div id="status">Downloading&hellip;</div>
      <div class="bar"><div id="progress"></div></div>
    </div>
    <div class="overlay" id="start" hidden>
      <button class="btn btn-big" id="play" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        Play
      </button>
      <div class="row">
        <button class="btn btn-quiet" id="watchLast" type="button" hidden>Watch last game</button>
        <button class="btn btn-quiet" id="downloadLast" type="button" hidden>Download last replay</button>
        <label class="btn btn-quiet" for="loadReplay" tabindex="0">Load replay&hellip;</label>
        <input type="file" id="loadReplay" accept=".txt,text/plain" hidden>
      </div>
      <div class="hint" id="pads">Using gamepads? Press a button on each one now (up to 4).</div>
    </div>
    <div class="overlay" id="end" hidden>
      <div id="endText">Replay finished</div>
      <div class="row">
        <button class="btn btn-big" id="playAgain" type="button">Play</button>
        <button class="btn btn-big btn-quiet" id="watchAgain" type="button">Watch again</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="fullscreen" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
      Fullscreen
    </button>
    <span class="hint">
      <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &middot; <kbd>&uarr;</kbd> jump &middot; <kbd>Right Ctrl</kbd> run / grab &middot;
      <kbd>Right Shift</kbd> use item &middot; <kbd>Enter</kbd> start &middot; <kbd>Esc</kbd> back
    </span>
  </div>

  <textarea id="output" rows="8" hidden readonly></textarea>

  <footer>
    A Rust port of <a href="https://github.com/mmatyas/supermariowar">Super Mario War</a> &middot;
    <a href="https://github.com/KyleJamesWalker/supermariowar-rust">source</a> &middot;
    <a href="#" id="downloadReplay" hidden>download replay</a> &middot;
    <a href="#" id="toggleLog">show log</a>
  </footer>

  <script>
    var canvasElement = document.getElementById('canvas');
    var outputElement = document.getElementById('output');
    var loadingElement = document.getElementById('loading');
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    outputElement.value = '';

    document.getElementById('toggleLog').addEventListener('click', function (e) {
      e.preventDefault();
      outputElement.hidden = !outputElement.hidden;
      this.textContent = outputElement.hidden ? 'show log' : 'hide log';
    });
    var stageElement = document.getElementById('stage');
    document.getElementById('fullscreen').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else stageElement.requestFullscreen({ navigationUI: 'hide' });
      canvasElement.focus();
    });
    canvasElement.addEventListener('click', function () { canvasElement.focus(); });

    // Browsers only expose a gamepad after one of its buttons is pressed, and the game (like upstream) lists
    // joysticks once at startup, so start it from a click after the pads are awake. The click also unlocks audio.
    var startElement = document.getElementById('start');
    var padsElement = document.getElementById('pads');
    var countPads = function () {
      var pads = navigator.getGamepads ? Array.prototype.filter.call(navigator.getGamepads(), Boolean) : [];
      padsElement.textContent = pads.length
        ? pads.length + ' gamepad' + (pads.length > 1 ? 's' : '') + ' ready. Press a button on any others, then Play.'
        : 'Using gamepads? Press a button on each one now (up to 4).';
    };
    window.addEventListener('gamepadconnected', countPads);
    window.addEventListener('gamepaddisconnected', countPads);

    // Settings and recordings live in IndexedDB; the game writes them to SAVE_DIR like any other file.
    var SAVE_DIR = '/home/web_user/Library/Preferences/.smw';
    var REPLAY_DIR = SAVE_DIR + '/replays';
    var WATCH_AGAIN_KEY = 'smw-watch-again';
    var watching = null;
    var started = false;
    var syncing = false;
    var saveFiles = function () {
      if (syncing || !started) return;
      syncing = true;
      Module.FS.syncfs(false, function (err) {
        syncing = false;
        if (err) console.warn('saving settings and replays failed', err);
      });
    };
    setInterval(saveFiles, 5000);
    document.addEventListener('visibilitychange', function () { if (document.hidden) saveFiles(); });
    window.addEventListener('pagehide', saveFiles);

    var lastRecording = function () {
      try {
        var names = Module.FS.readdir(REPLAY_DIR).filter(function (n) { return /\.txt$/.test(n); }).sort();
        return names.length ? REPLAY_DIR + '/' + names[names.length - 1] : null;
      } catch (e) {
        return null;
      }
    };
    var currentReplay = function () { return watching || lastRecording(); };
    var downloadFile = function (path) {
      if (!path) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([Module.FS.readFile(path)], { type: 'text/plain' }));
      a.download = path.split('/').pop();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
    };
    var downloadElement = document.getElementById('downloadReplay');
    downloadElement.addEventListener('click', function (e) {
      e.preventDefault();
      downloadFile(currentReplay());
    });

    var startGame = function (args) {
      startElement.hidden = true;
      started = true;
      downloadElement.hidden = false;
      canvasElement.focus();
      Module.callMain(args);
    };
    var watch = function (path) {
      watching = path;
      startGame(['--replay', path]);
    };
    var watchText = function (name, text) {
      var path = '/tmp/' + (name.replace(/[^\w.-]/g, '_') || 'replay.txt');
      Module.FS.writeFile(path, text);
      watch(path);
    };
    document.getElementById('play').addEventListener('click', function () { startGame([]); });
    document.getElementById('watchLast').addEventListener('click', function () { watch(lastRecording()); });
    document.getElementById('downloadLast').addEventListener('click', function () { downloadFile(lastRecording()); });
    document.querySelector('label[for=loadReplay]').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); document.getElementById('loadReplay').click(); }
    });
    document.getElementById('loadReplay').addEventListener('change', function () {
      var file = this.files[0];
      if (file) file.text().then(function (text) { watchText(file.name, text); });
    });

    // The browser main loop never returns, so a fresh page is the simplest way back to a clean game.
    var endElement = document.getElementById('end');
    document.getElementById('playAgain').addEventListener('click', function () { location.reload(); });
    document.getElementById('watchAgain').addEventListener('click', function () {
      var path = currentReplay();
      try {
        sessionStorage.setItem(WATCH_AGAIN_KEY, JSON.stringify({ name: path.split('/').pop(), text: Module.FS.readFile(path, { encoding: 'utf8' }) }));
      } catch (e) {}
      location.reload();
    });
    var showStart = function () {
      var pending = null;
      try {
        pending = JSON.parse(sessionStorage.getItem(WATCH_AGAIN_KEY));
        sessionStorage.removeItem(WATCH_AGAIN_KEY);
      } catch (e) {}
      if (pending) return watchText(pending.name, pending.text);
      var hasRecording = !!lastRecording();
      document.getElementById('watchLast').hidden = !hasRecording;
      document.getElementById('downloadLast').hidden = !hasRecording;
      countPads();
      startElement.hidden = false;
      document.getElementById('play').focus();
    };

    var setStatus = function (text) {
      var m = text && text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        statusElement.textContent = m[1].trim();
        progressElement.style.width = (100 * parseInt(m[2]) / parseInt(m[4])) + '%';
      } else if (text) {
        statusElement.textContent = text;
      } else {
        loadingElement.hidden = true;
      }
    };

    var Module = {
      print: function () {
        var text = Array.prototype.join.call(arguments, ' ');
        console.log(text);
        outputElement.value += text + '\n';
        outputElement.scrollTop = outputElement.scrollHeight;
      },
      canvas: canvasElement,
      setStatus: setStatus,
      noInitialRun: true,
      preRun: [function () {
        var FS = Module.FS;
        FS.mkdirTree(SAVE_DIR);
        FS.mount(FS.filesystems.IDBFS, {}, SAVE_DIR);
        Module.addRunDependency('idbfs');
        FS.syncfs(true, function (err) {
          if (err) console.warn('loading settings and replays failed', err);
          Module.removeRunDependency('idbfs');
        });
      }],
      onRuntimeInitialized: function () {
        if (!Module.noInitialRun) return;
        loadingElement.hidden = true;
        showStart();
      },
      onGameQuit: function () {
        saveFiles();
        document.getElementById('endText').textContent = watching ? 'Replay finished' : 'Game over';
        document.getElementById('watchAgain').hidden = !currentReplay();
        endElement.hidden = false;
        document.getElementById('playAgain').focus();
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        setStatus(left ? 'Loading… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
      }
    };
    window.onerror = function () {
      loadingElement.hidden = false;
      statusElement.textContent = 'Something went wrong — the log below has details.';
      outputElement.hidden = false;
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
