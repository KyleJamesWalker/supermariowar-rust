<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How to Play Super Mario War</title>
<meta name="description" content="The Super Mario War player's manual: menus, controls, game modes, blocks, items, options and the editors.">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#0e0f1a">
<style>
  :root {
    --bg: #0e0f1a;
    --panel: #171a2b;
    --line: #2a2e4a;
    --text: #e8e9f3;
    --muted: #8a8fb0;
    --accent: #e4002b;
    --accent-dark: #8c0019;
    --gold: #ffcc33;
    --link: #8fb8ff;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 64px; color-scheme: dark; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #22264a 0%, var(--bg) 60%) fixed var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--link); }
  a:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 16px;
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--gold);
    text-decoration: none;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 2px 2px 0 var(--accent-dark);
  }
  .brand img { width: 32px; height: 32px; image-rendering: pixelated; }
  .brand small { color: var(--muted); text-shadow: none; font-weight: 600; letter-spacing: 0.06em; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    font: 700 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(var(--accent), #b80022);
    border-radius: 8px;
    padding: 10px 14px;
    box-shadow: 0 3px 0 var(--accent-dark), 0 6px 12px rgba(0, 0, 0, 0.4);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn svg { width: 14px; height: 14px; }
  .btn-quiet { background: var(--panel); box-shadow: 0 3px 0 #05060b, 0 6px 12px rgba(0, 0, 0, 0.4); }
  .layout {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 16px 32px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
  }
  .toc {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .toc summary {
    cursor: pointer;
    padding: 10px 14px;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 13px;
  }
  .toc nav { scrollbar-width: thin; scrollbar-color: var(--line) transparent; max-height: 65vh; overflow-y: auto; padding: 0 8px 10px; overscroll-behavior: contain; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc ol ol { padding-left: 12px; margin: 2px 0 6px; border-left: 1px solid var(--line); }
  .toc a {
    display: block;
    padding: 3px 8px;
    border-radius: 6px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    line-height: 1.35;
  }
  .toc > nav > ol > li > a { font-weight: 700; margin-top: 4px; }
  .toc ol ol a { color: var(--muted); font-size: 13px; }
  .toc a:hover { background: #22264a; color: var(--text); }
  .toc a.current { background: var(--accent-dark); color: #fff; }
  .toc img { width: 16px; height: 16px; vertical-align: -3px; margin-right: 2px; image-rendering: pixelated; }
  @media (min-width: 960px) {
    html { scroll-padding-top: 16px; }
    .layout { grid-template-columns: 260px minmax(0, 760px); gap: 40px; }
    .toc { top: 16px; align-self: start; background: transparent; border: 0; }
    .toc summary { display: none; }
    .toc nav { max-height: calc(100vh - 32px); padding: 0 8px 0 0; }
  }
  main { min-width: 0; overflow-wrap: break-word; }
  main h1, main h2, main h3, main h4 { line-height: 1.25; position: relative; }
  main h1 {
    font-size: clamp(24px, 4vw, 34px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--accent-dark);
    margin: 28px 0 12px;
  }
  main h2 {
    font-size: 26px;
    color: var(--gold);
    border-bottom: 2px solid var(--line);
    padding-bottom: 6px;
    margin: 48px 0 16px;
  }
  main h3 { font-size: 20px; margin: 32px 0 10px; display: flex; align-items: center; gap: 10px; }
  main h4 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 24px 0 8px; }
  .anchor { margin-left: 8px; color: var(--muted); text-decoration: none; opacity: 0; font-weight: 400; }
  main :is(h1, h2, h3, h4):hover .anchor, .anchor:focus-visible { opacity: 1; }
  main img { max-width: 100%; height: auto; image-rendering: pixelated; }
  main img.icon { width: 32px; height: 32px; flex: none; }
  p.shot { text-align: center; margin: 16px 0; }
  p.shot img { border-radius: 6px; box-shadow: 0 0 0 3px #000, 0 0 0 5px var(--panel), 0 12px 28px rgba(0, 0, 0, 0.5); }
  blockquote {
    margin: 0 0 16px;
    padding: 10px 16px;
    border-left: 4px solid var(--accent);
    background: var(--panel);
    border-radius: 0 8px 8px 0;
    color: var(--muted);
    font-size: 15px;
  }
  blockquote p { margin: 0; }
  code { font: 0.88em ui-monospace, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  li::marker { color: var(--gold); }
  strong { color: #fff; }
  .table { overflow-x: auto; margin: 12px 0 16px; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 7px clamp(6px, 2vw, 12px); border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--panel); color: var(--gold); text-align: left; }
  tr:last-child td { border-bottom: 0; }
  td:first-child { color: var(--muted); font-weight: 600; }
  tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.025); }
  dl { margin: 12px 0; }
  dt {
    display: inline-block;
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid #2f3459;
    border-bottom-width: 3px;
    border-radius: 6px;
    padding: 2px 10px;
    font: 700 13px/1.6 ui-monospace, Menlo, monospace;
  }
  dd { margin: 6px 0 0 16px; }
  dd > p:first-child { margin-top: 0; }
  footer { max-width: 1120px; margin: 0 auto; padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><img src="favicon.png" alt="" width="32" height="32"><span>Super Mario War <small>How to play</small></span></a>
    <nav class="links">
      <a class="btn" href="./">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        Back to the game
      </a>
      <a class="btn btn-quiet" href="https://github.com/KyleJamesWalker/supermariowar-rust/blob/main/docs/GAME_MANUAL.md">View on GitHub</a>
    </nav>
  </header>

  <div class="layout">
    <details class="toc" id="toc" open>
      <summary>Contents</summary>
      <nav aria-label="Contents">
{{ TOC }}
      </nav>
    </details>
    <main>
{{ CONTENT }}
    </main>
  </div>

  <footer>
    A Rust port of <a href="https://github.com/mmatyas/supermariowar">Super Mario War</a> &middot;
    <a href="./">play</a> &middot;
    <a href="https://github.com/KyleJamesWalker/supermariowar-rust">source</a>
  </footer>

  <script>
    (function () {
      var toc = document.getElementById('toc');
      var wide = window.matchMedia('(min-width: 960px)');
      var fit = function () { toc.open = wide.matches; };
      fit();
      if (wide.addEventListener) wide.addEventListener('change', fit);
      toc.querySelector('nav').addEventListener('click', function (e) {
        if (e.target.closest('a') && !wide.matches) toc.open = false;
      });

      var links = {};
      Array.prototype.forEach.call(toc.querySelectorAll('a'), function (a) { links[a.hash.slice(1)] = a; });
      var current = null;
      var headings = document.querySelectorAll('main h2[id], main h3[id]');
      var mark = function () {
        var active = null;
        Array.prototype.forEach.call(headings, function (h) {
          if (h.getBoundingClientRect().top < 120) active = h;
        });
        var link = active && links[active.id];
        if (link === current) return;
        if (current) current.classList.remove('current');
        current = link;
        if (!link) return;
        link.classList.add('current');
        if (wide.matches) {
          var nav = toc.querySelector('nav');
          var r = link.getBoundingClientRect(), n = nav.getBoundingClientRect();
          if (r.top < n.top || r.bottom > n.bottom) nav.scrollTop += r.top - n.top - n.height / 3;
        }
      };
      var queued = false;
      window.addEventListener('scroll', function () {
        if (queued) return;
        queued = true;
        requestAnimationFrame(function () { queued = false; mark(); });
      }, { passive: true });
      mark();
    })();
  </script>
</body>
</html>
