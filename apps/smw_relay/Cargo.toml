[package]
name = "smw_relay"
version = "0.1.0"
edition.workspace = true
description = "Super Mario War netplay lobby and WebSocket relay for the browser build"
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "smw_relay"
path = "src/main.rs"

[dependencies]
smw-netplay = { path = "../../crates/smw-netplay" }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde_json = "1"
getrandom = "0.3"
