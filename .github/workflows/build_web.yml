name: Build - Web

on:
  workflow_call:
    inputs:
      version:
        description: Version in the file names (default the short commit)
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  EMSDK_VERSION: 5.0.2

jobs:
  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          git clone https://github.com/emscripten-core/emsdk.git --depth=1
          cd emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2

      - id: name
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "file=SuperMarioWar-${VERSION:-${SHA::7}}-web.zip" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          EMSDK: ${{ runner.temp }}/emsdk
        run: tools/package_web.sh

      - name: Package
        run: |
          cp -R dist/web "$RUNNER_TEMP/SuperMarioWar-web"
          (cd "$RUNNER_TEMP" && zip -q -r -X "$GITHUB_WORKSPACE/dist/${{ steps.name.outputs.file }}" SuperMarioWar-web)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: smw-web
          path: dist/${{ steps.name.outputs.file }}
          compression-level: 0
          if-no-files-found: error
