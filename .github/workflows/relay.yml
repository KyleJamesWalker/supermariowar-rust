name: Relay

on:
  push:
    branches: [main]
    paths:
      - relay/**
      - src/common/file_io.rs
      - src/common_netplay/**
      - src/globals/**
      - src/server/**
      - tools/ref/unordered_map_order.txt
      - Dockerfile
      - .dockerignore
      - .github/workflows/relay.yml
  pull_request:
    paths:
      - relay/**
      - src/common/file_io.rs
      - src/common_netplay/**
      - src/globals/**
      - src/server/**
      - tools/ref/unordered_map_order.txt
      - Dockerfile
      - .dockerignore
      - .github/workflows/relay.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kylejameswalker/supermariowar-rust-relay

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --release --locked --manifest-path relay/Cargo.toml

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "$IMAGE:${GITHUB_SHA::7}"
            if [ "$GITHUB_REF" = refs/heads/main ]; then echo "$IMAGE:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
