name: Build - Windows

on:
  workflow_call:
    inputs:
      version:
        description: Version in the file names (default the short commit)
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  msvc:
    name: MSVC x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: sdl
        uses: ./.github/actions/setup-native

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bins

      - id: name
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "file=SuperMarioWar-${VERSION:-${SHA::7}}-windows-x86_64.zip" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          SDL: ${{ steps.sdl.outputs.sdl-dir }}
        run: |
          app="$RUNNER_TEMP/SuperMarioWar"
          mkdir -p "$app"
          cp target/release/{smw,leveleditor,worldeditor,smw_server}.exe "$app/"
          cp "$SDL"/lib/*.dll "$app/"
          cp -R "$SDL/licenses" "$app/"
          cp -R data "$app/data"
          rm -f "$app/data/.git" "$app/data/maps/cache/mapsummary.txt"
          cp README.md CREDITS "$app/"
          ls -l "$app"
          mkdir -p dist
          (cd "$RUNNER_TEMP" && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/${{ steps.name.outputs.file }}" SuperMarioWar > /dev/null)
          ls -l dist

      - name: Smoke test
        env:
          SMW_NO_BUILD: '1'
          SDL_RENDER_DRIVER: software
        run: |
          app="$RUNNER_TEMP/SuperMarioWar"
          SMW_BIN="$app/smw.exe" SMW_DATA_DIR="$app/data" tools/run_rust.sh tools/replays/start_classic.txt "$RUNNER_TEMP/smoke" || status=$?
          ls -l "$RUNNER_TEMP/smoke"
          tail -n 20 "$RUNNER_TEMP/smoke/stdout.log"
          grep -c '^F ' "$RUNNER_TEMP/smoke/dump.txt"
          exit "${status:-0}"

      - uses: actions/upload-artifact@v4
        with:
          name: smw-windows-x86_64
          path: dist/${{ steps.name.outputs.file }}
          compression-level: 0
          if-no-files-found: error
