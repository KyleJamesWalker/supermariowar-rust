name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build_web.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smw-web

      - name: Extract
        run: unzip -q SuperMarioWar-*-web.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: SuperMarioWar-web

      - id: deployment
        uses: actions/deploy-pages@v4
