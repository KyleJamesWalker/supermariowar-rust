name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - '**'
      - '!**.md'
      - '!docs/**'
      - docs/guides/GAME_MANUAL.md
      - docs/guides/gfx/**
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CPP_REF_REPO: https://github.com/KyleJamesWalker/supermariowar-cpp-reference
  CPP_REF_BRANCH: harness-latest

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt (report only)
        run: |
          for m in crates/*/Cargo.toml apps/*/Cargo.toml; do
            n="$(cargo fmt --check --manifest-path "$m" 2>/dev/null | grep -c '^Diff in' || true)"
            echo "rustfmt $m: $n hunks differ" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: clippy
        run: |
          status=0
          for m in crates/*/Cargo.toml apps/*/Cargo.toml; do
            cargo clippy --locked --all-targets --manifest-path "$m" --message-format=short --color never 2> clippy.log || status=1
            grep -E ': (warning|error)' clippy.log | grep -v '^warning: `' > diags.txt || true
            echo "clippy $m: $(grep -c ': error' diags.txt || true) errors, $(grep -c ': warning' diags.txt || true) warnings" | tee -a "$GITHUB_STEP_SUMMARY"
            grep ': error' clippy.log || true
          done
          exit $status

  deny:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, apps/smw_relay/Cargo.toml]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --log-level warn --manifest-path "${{ matrix.manifest }}" --all-features check

  test:
    name: test (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - name: cargo test
        # Ubuntu 24.04 has no SDL3 package, so Linux builds it (cached with the target directory).
        run: cargo test --locked --workspace --exclude smw_relay ${{ runner.os == 'Linux' && '--features smw-sdl3/build-from-source' || '' }} ${{ matrix.profile == 'release' && '--release' || '' }}
      - name: Every replay's match under rollback
        if: matrix.profile == 'release'
        run: cargo test --locked --release --package smw-headless --test replays rollback_sweep -- --ignored

  net:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin smw --bin smw_relay --example lobby_connect

      - name: Lobby connect stress
        run: tools/ref/net_connect_stress.sh 20

      - name: Live recording round trip
        run: SMW_NO_BUILD=1 tools/live_roundtrip.sh tools/replays/text_shift.txt tools/replays/menu_nav.txt tools/replays/start_classic.txt

      - name: Net games over netplay v2 (GGRS over WebRTC, 60 ms lag, 10% loss), recorded and replayed offline
        env:
          SDL_RENDER_DRIVER: software
        run: timeout 20m tools/net_v2_test.py "$RUNNER_TEMP/net-games-v2"

      - name: Rematch in the same room over netplay v2
        env:
          SDL_RENDER_DRIVER: software
          NET_GAMES: net_rematch
        run: timeout 10m tools/net_v2_test.py "$RUNNER_TEMP/net-rematch-v2"

      - name: Net games hosted on a client, with no server (netplay v2 LAN host)
        env:
          SDL_RENDER_DRIVER: software
          LAN: '1'
          NET_GAMES: net_game net_game_frenzy net_rematch
        run: timeout 10m tools/net_v2_test.py "$RUNNER_TEMP/net-games-lan"

      - name: Net games with clients presenting at different rates
        env:
          SDL_RENDER_DRIVER: software
          NET_GAMES: net_game net_game_coins net_game_stompkill
          HOST_PRESENT_HZ: '50'
          JOIN_PRESENT_HZ: '144'
        run: timeout 10m tools/net_v2_test.py "$RUNNER_TEMP/net-games-mixed-rate"

      - name: A joiner killed mid-match over netplay v2
        env:
          SDL_RENDER_DRIVER: software
        run: timeout 5m tools/net_v2_disconnect_test.py "$RUNNER_TEMP/net-v2-disconnect"

      - name: Mismatched and misbehaving peers over netplay v2
        env:
          SDL_RENDER_DRIVER: software
        run: timeout 8m tools/net_v2_adversarial_test.py "$RUNNER_TEMP/net-v2-adversarial"

      - name: Upload net game logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: net-game-logs
          path: |
            ${{ runner.temp }}/net-games
            ${{ runner.temp }}/net-games-v2
            ${{ runner.temp }}/net-games-lan
            ${{ runner.temp }}/net-games-mixed-rate
            ${{ runner.temp }}/net-v2-disconnect
            ${{ runner.temp }}/net-v2-adversarial
          retention-days: 7

  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked --package smw_relay --package smw-netplay

  shaders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - run: sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: shaders
      - run: cargo build --release --locked -p smw --features shaders
      - name: Shader presenters on llvmpipe
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python3 tools/shader_shot_test.py "$RUNNER_TEMP/shader-shots"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shader-shots
          path: ${{ runner.temp }}/shader-shots
          retention-days: 7

  peer:
    runs-on: ubuntu-24.04
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --package smw-peer --target wasm32-unknown-emscripten
      - run: cargo build --release --locked --package smw-peer --examples

      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Browser and native peers in one room
        timeout-minutes: 3
        run: node tools/web_peer_test.mjs "$RUNNER_TEMP/web-peer"

      - name: Browser and native peers through TURN only
        timeout-minutes: 4
        env:
          TURN_URL: turn:127.0.0.1:3478
          TURN_SECRET: 0123abcd
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends coturn
          sudo systemctl stop coturn || true
          # The deploy config denies loopback peers; the test relays between allocations on 127.0.0.1.
          turnserver -c deploy/turnserver.conf --log-file=stdout --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 \
            --allowed-peer-ip=127.0.0.1 --allow-loopback-peers --static-auth-secret="$TURN_SECRET" \
            --pidfile="$RUNNER_TEMP/turnserver.pid" > "$RUNNER_TEMP/web-peer-turn.log" 2>&1 &
          sleep 1
          node tools/web_peer_test.mjs "$RUNNER_TEMP/web-peer-turn"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-peer
          path: |
            ${{ runner.temp }}/web-peer
            ${{ runner.temp }}/web-peer-turn
            ${{ runner.temp }}/web-peer-turn.log
          retention-days: 7

  parity-build:
    name: parity build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SMW_REF_DIR: ${{ github.workspace }}/../cpp-reference
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - id: ref
        if: runner.os != 'Windows'
        run: echo "sha=$(git ls-remote "$CPP_REF_REPO" "refs/heads/$CPP_REF_BRANCH" | cut -f 1)" >> "$GITHUB_OUTPUT"

      - id: ref-cache
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.SMW_REF_DIR }}/build/smw
            ${{ env.SMW_REF_DIR }}/build/smw-leveledit
            ${{ env.SMW_REF_DIR }}/build/smw-worldedit
          key: cpp-ref-${{ runner.os }}-${{ runner.arch }}-${{ steps.ref.outputs.sha }}-v2

      - name: Build the C++ reference
        if: runner.os != 'Windows' && steps.ref-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$CPP_REF_BRANCH" "$CPP_REF_REPO" "$SMW_REF_DIR"
          test "$(git -C "$SMW_REF_DIR" rev-parse HEAD)" = '${{ steps.ref.outputs.sha }}'
          if [[ $RUNNER_OS == Linux ]]; then
            sed -i '0,/^#ifdef __APPLE__$/s//#if defined(__APPLE__) || defined(__linux__)/' "$SMW_REF_DIR/src/common/path.cpp"
            git -C "$SMW_REF_DIR" diff --stat
            sudo apt-get install -y clang libc++-dev libc++abi-dev
            mkdir -p "$RUNNER_TEMP/cxx"
            printf '#!/bin/sh\nexec clang++ -stdlib=libc++ "$@"\n' > "$RUNNER_TEMP/cxx/clang++-libc++"
            chmod +x "$RUNNER_TEMP/cxx/clang++-libc++"
            export CC=clang CXX="$RUNNER_TEMP/cxx/clang++-libc++"
          fi
          "$SMW_REF_DIR/build-reference.sh"

      - name: Build
        run: |
          cargo build --release --locked --bins
          cargo check --release --locked -p smw --features shaders
          cargo build --release --locked -p smw3 ${{ runner.os == 'Linux' && '--features smw-sdl3/build-from-source' || '' }}

      - name: Pack
        run: |
          exe="${{ runner.os == 'Windows' && '.exe' || '' }}"
          tar -cf rust-bin.tar -C target/release "smw$exe" "smw3$exe" "smw_replay$exe" "leveleditor$exe" "worldeditor$exe" "leveleditor_replay$exe" "worldeditor_replay$exe"
          if [[ $RUNNER_OS != Windows ]]; then
            tar -cf cpp-ref.tar -C "$SMW_REF_DIR" build/smw build/smw-leveledit build/smw-worldedit
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: parity-bin-${{ matrix.os }}
          path: |
            rust-bin.tar
            cpp-ref.tar
          if-no-files-found: error
          retention-days: 1

  parity:
    name: parity (${{ matrix.os }}, ${{ matrix.check }})
    needs: parity-build
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        check: [goldens, cpp, segment, sweep-1, sweep-2]
        exclude:
          - os: windows
            check: cpp
          - os: windows
            check: segment
        include:
          - os: linux
            runner: ubuntu-24.04
            card: /mnt/sdcard
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-latest
            card: S
          - check: goldens
            suites: game editor
          - check: sweep-1
            suites: sweep
            shard: 1/2
          - check: sweep-2
            suites: sweep
            shard: 2/2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SMW_REF_DIR: ${{ github.workspace }}/../cpp-reference
      SMW_EDITOR_REF_DIR: ${{ github.workspace }}/../cpp-reference
      JOBS: '4'
      CARD: ${{ matrix.card }}
      LABEL: ${{ (matrix.check == 'goldens' || matrix.os == 'windows') && 'parity' || 'sweep' }}-${{ matrix.os }}
    steps:
      # The goldens' text files are compared byte for byte.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native

      - uses: actions/download-artifact@v8
        with:
          name: parity-bin-${{ matrix.os }}

      - name: Unpack
        run: |
          mkdir -p target/release
          tar -xf rust-bin.tar -C target/release
          if [[ -f cpp-ref.tar ]]; then
            mkdir -p "$SMW_REF_DIR"
            tar -xf cpp-ref.tar -C "$SMW_REF_DIR"
          fi

      - name: libc++ for the C++ reference
        if: runner.os == 'Linux' && matrix.check == 'cpp'
        run: sudo apt-get install -y libc++-dev libc++abi-dev

      - name: python3 for the tools
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          cygpath -w "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - if: runner.os != 'macOS'
        uses: ./.github/actions/fat32-card
        with:
          path: ${{ env.CARD }}

      - name: Data on the FAT32 card
        if: runner.os == 'Linux'
        run: |
          python3 tools/apfs_order.py data "$CARD/data"
          sudo mount --bind "$CARD/data" data
          echo "TMPDIR=$CARD/tmp" >> "$GITHUB_ENV"
          echo "SDL_RENDER_DRIVER=software" >> "$GITHUB_ENV"

      - if: runner.os == 'Windows'
        run: |
          echo "TMPDIR=$CARD:/tmp" >> "$GITHUB_ENV"
          echo "SDL_RENDER_DRIVER=software" >> "$GITHUB_ENV"

      - name: Game parity
        if: matrix.check == 'goldens'
        env:
          SMW_NO_BUILD: '1'
          PARITY_OUT: ${{ runner.temp }}/parity/game
        run: |
          status=0
          tools/parity.sh > game.log || status=$?
          sed -n '/^=== summary/,$p' game.log > game-summary.txt
          {
            echo "### Game parity vs the committed Rust goldens (${{ matrix.os }})"
            echo "$(grep -c 'MATCH all' game-summary.txt) of $(($(wc -l < game-summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' game-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat game.log
          [[ -s game-summary.txt ]] || exit 1
          exit $status

      - name: Headless parity
        if: matrix.check == 'goldens'
        env:
          SMW_NO_BUILD: '1'
          PARITY_OUT: ${{ runner.temp }}/parity-headless/game
        run: |
          status=0
          SMW_BIN="$PWD/target/release/smw_replay" tools/parity.sh > headless.log || status=$?
          sed -n '/^=== summary/,$p' headless.log > headless-summary.txt
          {
            echo "### Headless parity vs the committed goldens (${{ matrix.os }})"
            echo "$(grep -c 'MATCH all' headless-summary.txt) of $(($(wc -l < headless-summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' headless-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat headless.log
          [[ -s headless-summary.txt ]] || exit 1
          exit $status

      - name: Editor parity
        if: ${{ !cancelled() && matrix.check == 'goldens' }}
        env:
          SMW_NO_BUILD: '1'
          PARITY_OUT: ${{ runner.temp }}/parity/editor
        run: |
          status=0
          tools/editor_parity.sh > editor.log || status=$?
          sed -n '/^=== summary/,$p' editor.log > summary.txt
          {
            echo "### Editor parity vs the committed Rust goldens (${{ matrix.os }})"
            echo '```'
            grep -v -E 'dump MATCH, shots ([0-9]+)/\1, files ([0-9]+)/\2$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat editor.log
          [[ -s summary.txt ]] || exit 1
          exit $status

      - name: SDL3 parity
        if: matrix.check == 'goldens'
        env:
          SMW_NO_BUILD: '1'
          PARITY_OUT: ${{ runner.temp }}/parity-sdl3/game
        run: |
          status=0
          SMW_BIN="$PWD/target/release/smw3" tools/parity.sh > sdl3.log || status=$?
          sed -n '/^=== summary/,$p' sdl3.log > sdl3-summary.txt
          {
            echo "### SDL3 parity vs the committed goldens (${{ matrix.os }})"
            echo "$(grep -c 'MATCH all' sdl3-summary.txt) of $(($(wc -l < sdl3-summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' sdl3-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat sdl3.log
          [[ -s sdl3-summary.txt ]] || exit 1
          exit $status

      - name: Display lists re-render every gameplay frame exactly
        if: matrix.check == 'goldens' && matrix.os == 'linux'
        env:
          SMW_NO_BUILD: '1'
        run: python3 tools/display_list_check.py --jobs "$JOBS" tools/replays/*.txt

      - name: Headless editor parity
        if: ${{ !cancelled() && matrix.check == 'goldens' }}
        env:
          SMW_NO_BUILD: '1'
          SMW_EDITOR_BIN_SUFFIX: _replay
          PARITY_OUT: ${{ runner.temp }}/parity-headless/editor
        run: |
          status=0
          tools/editor_parity.sh > headless-editor.log || status=$?
          sed -n '/^=== summary/,$p' headless-editor.log > summary.txt
          {
            echo "### Headless editor parity vs the committed goldens (${{ matrix.os }})"
            echo '```'
            grep -v -E 'dump MATCH, shots ([0-9]+)/\1, files ([0-9]+)/\2$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat headless-editor.log
          [[ -s summary.txt ]] || exit 1
          exit $status

      - name: C++ goldens
        if: matrix.check == 'cpp'
        env:
          GOLDEN_ROOT: ${{ runner.temp }}/cpp-goldens
          SMW_DATA_DIR: ${{ github.workspace }}/data
        run: |
          one() {
            local script=$1 out
            if [[ $script == */editor_replays/* ]]; then
              out="$GOLDEN_ROOT/editor_golden/$(basename "$(dirname "$script")")/$(basename "$script" .txt)"
              tools/run_editor.sh "$(basename "$(dirname "$script")")" "$script" "$out" > /dev/null || true
            else
              out="$GOLDEN_ROOT/golden/$(basename "$script" .txt)"
              tools/run_ref.sh "$script" "$out" > /dev/null || true
            fi
            rm -f "$out/stdout.log"
            if [[ -f $out/dump.txt ]]; then gzip -n "$out/dump.txt"; fi
          }
          export -f one
          printf '%s\0' tools/replays/*.txt tools/editor_replays/*/*.txt | xargs -0 -n 1 -P "$JOBS" bash -c 'one "$0"'
          du -sh "$GOLDEN_ROOT"/*

      - name: Game parity vs the C++ built here
        if: ${{ !cancelled() && matrix.check == 'cpp' }}
        env:
          SMW_NO_BUILD: '1'
          GOLDEN_ROOT: ${{ runner.temp }}/cpp-goldens
          PARITY_OUT: ${{ runner.temp }}/parity/game-cpp
        run: |
          status=0
          tools/parity.sh > game-cpp.log || status=$?
          sed -n '/^=== summary/,$p' game-cpp.log > summary.txt
          {
            echo "### Game parity vs the C++ built here (${{ matrix.os }}, report-only)"
            echo "$(grep -c 'MATCH all' summary.txt) of $(($(wc -l < summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat game-cpp.log
          expected="$(grep -v '^#' tools/cpp_divergences.txt | cut -d' ' -f1)"
          for name in $(grep -E '^[^ ]+ +DIVERGE' summary.txt | awk '{print $1}'); do
            grep -qx "$name" <<< "$expected" || echo "::warning::$name diverges from the C++ reference and is not in tools/cpp_divergences.txt"
          done
          echo "::notice::Report-only: the Rust goldens gate; this compares with the C++ reference built here (status $status)."

      - name: Editor parity vs the C++ built here
        if: ${{ !cancelled() && matrix.check == 'cpp' }}
        env:
          SMW_NO_BUILD: '1'
          GOLDEN_ROOT: ${{ runner.temp }}/cpp-goldens
          PARITY_OUT: ${{ runner.temp }}/parity/editor-cpp
        run: |
          status=0
          tools/editor_parity.sh > editor-cpp.log || status=$?
          {
            echo "### Editor parity vs the C++ built here (${{ matrix.os }}, report-only)"
            echo '```'
            sed -n '/^=== summary/,$p' editor-cpp.log | grep -v -E 'dump MATCH, shots ([0-9]+)/\1, files ([0-9]+)/\2$'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat editor-cpp.log
          echo "::notice::Report-only: the Rust goldens gate; this compares with the C++ reference built here (status $status)."

      - name: Segment check
        if: matrix.check == 'segment'
        env:
          SMW_NO_BUILD: '1'
        run: |
          python3 tools/segment_check.py --jobs "$JOBS" tools/segment_replays/*.txt | tee segment.log
          {
            echo "### Segment check (${{ matrix.os }})"
            tail -n 1 segment.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sweep parity
        if: matrix.shard
        env:
          SMW_NO_BUILD: '1'
          SHARD: ${{ matrix.shard }}
          PARITY_OUT: ${{ runner.temp }}/parity/sweep
        run: |
          status=0
          tools/parity_sweep.sh > sweep.log || status=$?
          sed -n '/^=== summary/,$p' sweep.log > summary.txt
          {
            echo "### Map sweep vs the committed Rust goldens (${{ matrix.os }}, shard $SHARD)"
            echo "$(grep -c 'MATCH all' summary.txt) of $(($(wc -l < summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' sweep.log | grep -v -E '^(=== |OK: )' || true
          [[ -s summary.txt ]] || exit 1
          exit $status

      - name: Unverified blits
        if: ${{ !cancelled() && matrix.suites }}
        run: |
          dirs=()
          for suite in ${{ matrix.suites }}; do dirs+=("$RUNNER_TEMP/parity/$suite"); done
          tools/blit_unverified.sh "${dirs[@]}" > unverified.txt && { cat unverified.txt; exit 0; }
          { echo "### Unverified blits"; echo '```'; cat unverified.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat unverified.txt
          echo "::error::The software blitter drew a surface state it is not verified against SDL for; see the job summary."
          exit 1

      - name: Determinism manifest
        if: ${{ !cancelled() && matrix.suites }}
        run: |
          args=()
          for suite in ${{ matrix.suites }}; do args+=("$suite" "$RUNNER_TEMP/parity/$suite"); done
          python3 tools/determinism.py manifest "$LABEL" "${args[@]}" > "$RUNNER_TEMP/determinism-$LABEL-${{ matrix.check }}.txt"
          if [[ -d $RUNNER_TEMP/parity-headless ]]; then
            python3 tools/determinism.py manifest "headless-${{ matrix.os }}" game "$RUNNER_TEMP/parity-headless/game" editor "$RUNNER_TEMP/parity-headless/editor" > "$RUNNER_TEMP/determinism-headless-${{ matrix.os }}.txt"
          fi
          if [[ -d $RUNNER_TEMP/parity-sdl3 ]]; then
            python3 tools/determinism.py manifest "sdl3-${{ matrix.os }}" game "$RUNNER_TEMP/parity-sdl3/game" > "$RUNNER_TEMP/determinism-sdl3-${{ matrix.os }}.txt"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.suites }}
        with:
          name: determinism-${{ env.LABEL }}-${{ matrix.check }}
          path: ${{ runner.temp }}/determinism-${{ env.LABEL }}-${{ matrix.check }}.txt
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.check == 'goldens' }}
        with:
          name: determinism-headless-${{ matrix.os }}
          path: ${{ runner.temp }}/determinism-headless-${{ matrix.os }}.txt
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.check == 'goldens' }}
        with:
          name: determinism-sdl3-${{ matrix.os }}
          path: ${{ runner.temp }}/determinism-sdl3-${{ matrix.os }}.txt
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure() && !matrix.shard
        with:
          name: parity-${{ matrix.os }}-${{ matrix.check }}
          path: |
            ${{ runner.temp }}/parity
            ${{ runner.temp }}/parity-headless
            ${{ runner.temp }}/parity-sdl3
            *.log
          retention-days: 7

  build-linux:
    uses: ./.github/workflows/build_linux.yml
  build-macos:
    uses: ./.github/workflows/build_macos.yml
  build-windows:
    uses: ./.github/workflows/build_windows.yml
  build-muxapp:
    uses: ./.github/workflows/build_muxapp.yml
  build-web:
    uses: ./.github/workflows/build_web.yml
  build-android:
    uses: ./.github/workflows/build_android.yml
    secrets: inherit

  web:
    name: web (${{ matrix.name }})
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clip
            native: true
            timeout: 15
            run: node tools/web_clip_test.mjs "$RUNNER_TEMP/web-clip"
          - name: ui
            timeout: 10
            run: node tools/web_ui_test.mjs "$RUNNER_TEMP/web-ui"
          - name: text entry
            native: true
            timeout: 6
            run: node tools/web_text_entry_test.mjs "$RUNNER_TEMP/web-text-entry"
          - name: netplay v2
            native: true
            timeout: 30
            games: net_game net_game_frenzy net_game_stomp net_game_coins
            run: node tools/web_netplay_test.mjs "$RUNNER_TEMP/web-netplay-v2"
          - name: netplay v2 mixed
            native: true
            timeout: 30
            games: net_game net_game_blocks net_game_classic net_game_stompkill_powerup
            run: MIXED=1 node tools/web_netplay_test.mjs "$RUNNER_TEMP/web-netplay-mixed"
          - name: replays 1
            timeout: 20
            replays: true
            shard: 1
            run: &web-replays |
              printf '%s\n' tools/replays/*.txt | awk -v k="$SHARD" 'NR % 2 == k % 2' | tr '\n' '\0' | xargs -0 -n 1 -P 4 bash -c \
                'timeout 5m node tools/web_replay.mjs "$0" "$RUNNER_TEMP/web-replays/$(basename "$0" .txt)" > /dev/null 2>&1 || echo "::warning::web_replay $0 failed"'
          - name: replays 2
            timeout: 20
            replays: true
            shard: 2
            run: *web-replays
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDL_RENDER_DRIVER: software
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - if: matrix.native
        uses: ./.github/actions/setup-native
      - if: matrix.native
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.native
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
          save-if: ${{ matrix.name == 'clip' }}

      - uses: actions/download-artifact@v8
        with:
          name: smw-web
          path: ${{ runner.temp }}

      - name: Extract
        run: |
          unzip -q "$RUNNER_TEMP"/SuperMarioWar-*-web.zip -d "$RUNNER_TEMP"
          mkdir -p dist
          mv "$RUNNER_TEMP/SuperMarioWar-web" dist/web

      - name: Build
        if: matrix.native
        run: |
          cargo build --release --locked --bin smw
          cargo build --release --locked --package smw_relay

      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        continue-on-error: ${{ matrix.replays == true }}
        timeout-minutes: ${{ matrix.timeout }}
        env:
          NET_GAMES: ${{ matrix.games }}
          SHARD: ${{ matrix.shard }}
        run: ${{ matrix.run }}

      - name: Determinism manifest
        if: ${{ !cancelled() && matrix.replays }}
        run: python3 tools/determinism.py manifest web game "$RUNNER_TEMP/web-replays" > "$RUNNER_TEMP/determinism-web-${{ matrix.shard }}.txt"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.replays }}
        with:
          name: determinism-web-${{ matrix.shard }}
          path: ${{ runner.temp }}/determinism-web-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-test-${{ strategy.job-index }}
          path: ${{ runner.temp }}/web-*
          retention-days: 7

  headless-aarch64:
    name: headless (aarch64 under qemu-user)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Debian names the arm64 packages on the main mirror; Ubuntu needs ports.ubuntu.com for them.
    container: mirror.gcr.io/library/rust:1.94-bookworm
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: arm64 toolchain, libraries and qemu-user
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libsdl2-dev:arm64 libsdl2-image-dev:arm64 libsdl2-mixer-dev:arm64 qemu-user-static cmake libclang-dev python3
          rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      - name: Build smw_replay for aarch64
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu -p smw_replay
      - name: Headless parity under qemu-aarch64
        env:
          SMW_NO_BUILD: '1'
          JOBS: '4'
          PARITY_OUT: ${{ github.workspace }}/headless-aarch64/game
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec qemu-aarch64-static "%s" "$@"\n' "$PWD/target/aarch64-unknown-linux-gnu/release/smw_replay" > "$RUNNER_TEMP/bin/smw_replay"
          chmod +x "$RUNNER_TEMP/bin/smw_replay"
          status=0
          SMW_BIN="$RUNNER_TEMP/bin/smw_replay" tools/parity.sh > headless.log || status=$?
          sed -n '/^=== summary/,$p' headless.log > headless-summary.txt
          {
            echo "### Headless parity, aarch64 under qemu-user"
            echo "$(grep -c 'MATCH all' headless-summary.txt) of $(($(wc -l < headless-summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' headless-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat headless.log
          [[ -s headless-summary.txt ]] || exit 1
          exit $status
      - name: Headless editor parity under qemu-aarch64
        if: ${{ !cancelled() }}
        env:
          SMW_NO_BUILD: '1'
          SMW_EDITOR_BIN_SUFFIX: _replay
          PARITY_OUT: ${{ github.workspace }}/headless-aarch64/editor
        run: |
          mkdir -p target/release
          for b in leveleditor_replay worldeditor_replay; do
            printf '#!/bin/sh\nexec qemu-aarch64-static "%s" "$@"\n' "$PWD/target/aarch64-unknown-linux-gnu/release/$b" > "target/release/$b"
            chmod +x "target/release/$b"
          done
          status=0
          tools/editor_parity.sh > headless-editor.log || status=$?
          sed -n '/^=== summary/,$p' headless-editor.log > summary.txt
          {
            echo "### Headless editor parity, aarch64 under qemu-user"
            echo '```'
            grep -v -E 'dump MATCH, shots ([0-9]+)/\1, files ([0-9]+)/\2$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat headless-editor.log
          [[ -s summary.txt ]] || exit 1
          exit $status
      - name: Determinism manifest
        if: ${{ !cancelled() }}
        run: python3 tools/determinism.py manifest headless-aarch64-qemu game headless-aarch64/game editor headless-aarch64/editor > determinism-headless-aarch64-qemu.txt
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: determinism-headless-aarch64-qemu
          path: determinism-headless-aarch64-qemu.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: headless-aarch64
          path: |
            headless-aarch64
            headless.log
            headless-editor.log
          retention-days: 7

  determinism:
    name: determinism
    needs: [parity, web, headless-aarch64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          path: ${{ runner.temp }}/determinism
          merge-multiple: true
      - name: Compare the manifests
        run: |
          shopt -s nullglob
          status=0
          python3 tools/determinism.py compare "$RUNNER_TEMP/determinism-summary.md" "$RUNNER_TEMP"/determinism/determinism-*.txt || status=$?
          cat "$RUNNER_TEMP/determinism-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: determinism-summary
          path: |
            ${{ runner.temp }}/determinism-summary.md
            ${{ runner.temp }}/determinism/
          if-no-files-found: ignore
          retention-days: 30
