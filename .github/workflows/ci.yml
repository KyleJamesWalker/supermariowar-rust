name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - '**'
      - '!**.md'
      - '!docs/**'
      - docs/GAME_MANUAL.md
      - docs/gfx/**
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CPP_REF_REPO: https://github.com/KyleJamesWalker/supermariowar-cpp-reference
  CPP_REF_BRANCH: harness-latest

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt (report only)
        run: |
          for m in crates/*/Cargo.toml apps/*/Cargo.toml; do
            n="$(cargo fmt --check --manifest-path "$m" 2>/dev/null | grep -c '^Diff in' || true)"
            echo "rustfmt $m: $n hunks differ" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: clippy
        run: |
          status=0
          for m in crates/*/Cargo.toml apps/*/Cargo.toml; do
            cargo clippy --locked --all-targets --manifest-path "$m" --message-format=short --color never 2> clippy.log || status=1
            grep -E ': (warning|error)' clippy.log | grep -v '^warning: `' > diags.txt || true
            echo "clippy $m: $(grep -c ': error' diags.txt || true) errors, $(grep -c ': warning' diags.txt || true) warnings" | tee -a "$GITHUB_STEP_SUMMARY"
            grep ': error' clippy.log || true
          done
          exit $status

  deny:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, apps/smw_relay/Cargo.toml]
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}

  test:
    name: test (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - name: cargo test
        run: cargo test --locked --workspace --exclude smw_relay ${{ matrix.profile == 'release' && '--release' || '' }}

  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked --package smw_relay --package smw-netplay

  parity:
    name: parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SMW_REF_DIR: ${{ github.workspace }}/../cpp-reference
      SMW_EDITOR_REF_DIR: ${{ github.workspace }}/../cpp-reference
      JOBS: '4'
      CARD: /mnt/sdcard
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - id: ref
        run: echo "sha=$(git ls-remote "$CPP_REF_REPO" "refs/heads/$CPP_REF_BRANCH" | cut -f 1)" >> "$GITHUB_OUTPUT"

      - id: ref-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.SMW_REF_DIR }}/build/smw
            ${{ env.SMW_REF_DIR }}/build/smw-leveledit
            ${{ env.SMW_REF_DIR }}/build/smw-worldedit
          key: cpp-ref-${{ runner.os }}-${{ runner.arch }}-${{ steps.ref.outputs.sha }}-v2

      - name: Build the C++ reference
        if: steps.ref-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$CPP_REF_BRANCH" "$CPP_REF_REPO" "$SMW_REF_DIR"
          test "$(git -C "$SMW_REF_DIR" rev-parse HEAD)" = '${{ steps.ref.outputs.sha }}'
          if [[ $RUNNER_OS == Linux ]]; then
            sed -i '0,/^#ifdef __APPLE__$/s//#if defined(__APPLE__) || defined(__linux__)/' "$SMW_REF_DIR/src/common/path.cpp"
            git -C "$SMW_REF_DIR" diff --stat
            sudo apt-get install -y clang libc++-dev libc++abi-dev
            mkdir -p "$RUNNER_TEMP/cxx"
            printf '#!/bin/sh\nexec clang++ -stdlib=libc++ "$@"\n' > "$RUNNER_TEMP/cxx/clang++-libc++"
            chmod +x "$RUNNER_TEMP/cxx/clang++-libc++"
            export CC=clang CXX="$RUNNER_TEMP/cxx/clang++-libc++"
          fi
          "$SMW_REF_DIR/build-reference.sh"

      - if: runner.os == 'Linux'
        uses: ./.github/actions/fat32-card
        with:
          path: ${{ env.CARD }}

      - name: Data on the FAT32 card
        if: runner.os == 'Linux'
        run: |
          python3 tools/apfs_order.py data "$CARD/data"
          sudo mount --bind "$CARD/data" data
          echo "TMPDIR=$CARD/tmp" >> "$GITHUB_ENV"
          echo "SDL_RENDER_DRIVER=software" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --bins

      - name: Game parity
        id: game
        env:
          SMW_NO_BUILD: '1'
          PARITY_OUT: ${{ runner.temp }}/parity/game
        run: |
          status=0
          tools/parity.sh > game.log || status=$?
          sed -n '/^=== summary/,$p' game.log > game-summary.txt
          {
            echo "### Game parity vs the committed goldens (${{ matrix.os }})"
            echo "$(grep -c 'MATCH all' game-summary.txt) of $(($(wc -l < game-summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' game-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat game.log
          [[ -s game-summary.txt ]] || exit 1
          exit $status

      - name: C++ goldens
        if: always() && steps.game.outcome != 'skipped'
        env:
          GOLDEN_ROOT: ${{ runner.temp }}/cpp-goldens
          SMW_DATA_DIR: ${{ github.workspace }}/data
        run: |
          one() {
            local script=$1 out
            if [[ $script == */editor_replays/* ]]; then
              out="$GOLDEN_ROOT/editor_golden/$(basename "$(dirname "$script")")/$(basename "$script" .txt)"
              tools/run_editor.sh "$(basename "$(dirname "$script")")" "$script" "$out" > /dev/null || true
            else
              out="$GOLDEN_ROOT/golden/$(basename "$script" .txt)"
              tools/run_ref.sh "$script" "$out" > /dev/null || true
            fi
            rm -f "$out/stdout.log"
            if [[ -f $out/dump.txt ]]; then gzip -n "$out/dump.txt"; fi
          }
          export -f one
          printf '%s\0' tools/replays/*.txt tools/editor_replays/*/*.txt | xargs -0 -n 1 -P "$JOBS" bash -c 'one "$0"'
          du -sh "$GOLDEN_ROOT"/*

      - name: Game parity vs the C++ built here
        if: always() && steps.game.outcome != 'skipped'
        env:
          SMW_NO_BUILD: '1'
          GOLDEN_ROOT: ${{ runner.temp }}/cpp-goldens
          PARITY_OUT: ${{ runner.temp }}/parity/game-cpp
        run: |
          status=0
          tools/parity.sh > game-cpp.log || status=$?
          sed -n '/^=== summary/,$p' game-cpp.log > summary.txt
          {
            echo "### Game parity vs the C++ built here (${{ matrix.os }})"
            echo "$(grep -c 'MATCH all' summary.txt) of $(($(wc -l < summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat game-cpp.log
          if [[ $RUNNER_OS == Linux && $status -ne 0 ]]; then
            echo "::notice::The C++ reference built on Linux diverges from its macOS goldens; this comparison is report-only on Linux."
            exit 0
          fi
          exit $status

      - name: Editor parity
        if: always() && steps.game.outcome != 'skipped'
        env:
          PARITY_OUT: ${{ runner.temp }}/parity/editor
        run: |
          status=0
          tools/editor_parity.sh > editor.log || status=$?
          sed -n '/^=== summary/,$p' editor.log > summary.txt
          {
            echo "### Editor parity vs the committed goldens (${{ matrix.os }})"
            echo '```'
            grep -v -E 'dump MATCH, shots ([0-9]+)/\1, files ([0-9]+)/\2$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat editor.log
          [[ -s summary.txt ]] || exit 1
          if [[ $RUNNER_OS == macOS ]]; then exit $status; fi
          ! tail -n +2 summary.txt | grep -v -E 'dump MATCH, shots [0-9]+/[0-9]+, files ([0-9]+)/\1$'

      - name: Editor parity vs the C++ built here
        if: always() && steps.game.outcome != 'skipped'
        env:
          GOLDEN_ROOT: ${{ runner.temp }}/cpp-goldens
          PARITY_OUT: ${{ runner.temp }}/parity/editor-cpp
        run: |
          status=0
          tools/editor_parity.sh > editor-cpp.log || status=$?
          {
            echo "### Editor parity vs the C++ built here (${{ matrix.os }})"
            echo '```'
            sed -n '/^=== summary/,$p' editor-cpp.log | grep -v -E 'dump MATCH, shots ([0-9]+)/\1, files ([0-9]+)/\2$'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat editor-cpp.log
          if [[ $RUNNER_OS == Linux && $status -ne 0 ]]; then
            echo "::notice::The C++ reference built on Linux diverges from its macOS goldens; this comparison is report-only on Linux."
            exit 0
          fi
          exit $status

      - name: Segment check
        if: always() && steps.game.outcome != 'skipped'
        env:
          SMW_NO_BUILD: '1'
        run: |
          python3 tools/segment_check.py --jobs "$JOBS" tools/segment_replays/*.txt | tee segment.log
          {
            echo "### Segment check (${{ matrix.os }})"
            tail -n 1 segment.log
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: parity-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/parity
            *.log
          retention-days: 7

  sweep:
    name: sweep (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      JOBS: '4'
      CARD: /mnt/sdcard
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - if: runner.os == 'Linux'
        uses: ./.github/actions/fat32-card
        with:
          path: ${{ env.CARD }}

      - name: Data on the FAT32 card
        if: runner.os == 'Linux'
        run: |
          python3 tools/apfs_order.py data "$CARD/data"
          sudo mount --bind "$CARD/data" data
          echo "TMPDIR=$CARD/tmp" >> "$GITHUB_ENV"
          echo "SDL_RENDER_DRIVER=software" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --bin smw

      - name: Sweep parity
        env:
          SMW_NO_BUILD: '1'
          PARITY_OUT: ${{ runner.temp }}/parity/sweep
        run: |
          status=0
          tools/parity_sweep.sh > sweep.log || status=$?
          sed -n '/^=== summary/,$p' sweep.log > summary.txt
          {
            echo "### Map sweep vs the committed goldens (${{ matrix.os }})"
            echo "$(grep -c 'MATCH all' summary.txt) of $(($(wc -l < summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' sweep.log | grep -v -E '^(=== |OK: )' || true
          [[ -s summary.txt ]] || exit 1
          exit $status

  parity-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      JOBS: '4'
      SDL_RENDER_DRIVER: software
      CARD: S
    steps:
      # The goldens' text files are compared byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bins

      - name: python3 for the tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          cygpath -w "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/fat32-card
        with:
          path: ${{ env.CARD }}

      - run: echo "TMPDIR=$CARD:/tmp" >> "$GITHUB_ENV"

      - name: Game parity
        id: game
        env:
          SMW_NO_BUILD: '1'
          PARITY_OUT: ${{ runner.temp }}/parity/game
        run: |
          status=0
          tools/parity.sh > game.log || status=$?
          sed -n '/^=== summary/,$p' game.log > summary.txt
          {
            echo "### Game parity vs the committed goldens (windows)"
            echo "$(grep -c 'MATCH all' summary.txt) of $(($(wc -l < summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat game.log
          exit $status

      - name: Editor parity
        if: always() && steps.game.outcome != 'skipped'
        env:
          PARITY_OUT: ${{ runner.temp }}/parity/editor
        run: |
          status=0
          tools/editor_parity.sh > editor.log || status=$?
          sed -n '/^=== summary/,$p' editor.log > summary.txt
          {
            echo "### Editor parity vs the committed goldens (windows)"
            echo '```'
            grep -v -E 'dump MATCH, shots ([0-9]+)/\1, files ([0-9]+)/\2$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat editor.log
          [[ -s summary.txt ]] || exit 1
          ! tail -n +2 summary.txt | grep -v -E 'dump MATCH, shots [0-9]+/[0-9]+, files ([0-9]+)/\1$'

      - name: Sweep parity
        if: always() && steps.game.outcome != 'skipped'
        env:
          SMW_NO_BUILD: '1'
          PARITY_OUT: ${{ runner.temp }}/parity/sweep
        run: |
          status=0
          tools/parity_sweep.sh > sweep.log || status=$?
          sed -n '/^=== summary/,$p' sweep.log > summary.txt
          {
            echo "### Map sweep vs the committed goldens (windows)"
            echo "$(grep -c 'MATCH all' summary.txt) of $(($(wc -l < summary.txt) - 1)) dumps match"
            echo '```'
            grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -v -E 'MATCH all .* shots ([0-9]+)/\1$' sweep.log | grep -v -E '^(=== |OK: )' || true
          [[ -s summary.txt ]] || exit 1
          exit $status

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: parity-windows
          path: |
            ${{ runner.temp }}/parity
            *.log
          retention-days: 7

  build-linux:
    uses: ./.github/workflows/build_linux.yml
  build-macos:
    uses: ./.github/workflows/build_macos.yml
  build-windows:
    uses: ./.github/workflows/build_windows.yml
  build-muxapp:
    uses: ./.github/workflows/build_muxapp.yml
  build-web:
    uses: ./.github/workflows/build_web.yml
  build-android:
    uses: ./.github/workflows/build_android.yml
    secrets: inherit

  web:
    needs: build-web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDL_RENDER_DRIVER: software
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-native
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: smw-web
          path: ${{ runner.temp }}

      - name: Extract
        run: |
          unzip -q "$RUNNER_TEMP"/SuperMarioWar-*-web.zip -d "$RUNNER_TEMP"
          mkdir -p dist
          mv "$RUNNER_TEMP/SuperMarioWar-web" dist/web

      - name: Build
        run: cargo build --release --locked --bin smw --bin smw_relay

      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Web clip test
        run: timeout 15m node tools/web_clip_test.mjs "$RUNNER_TEMP/web-clip"

      - name: Web UI test
        if: always()
        run: timeout 10m node tools/web_ui_test.mjs "$RUNNER_TEMP/web-ui"

      # net_game_frenzy, net_game_coins and net_game_classic do not pass reliably yet.
      - name: Web netplay test
        if: always()
        env:
          NET_GAMES: net_game net_game_blocks net_game_stomp
        run: timeout 25m node tools/web_netplay_test.mjs "$RUNNER_TEMP/web-netplay"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-test
          path: ${{ runner.temp }}/web-*
          retention-days: 7
