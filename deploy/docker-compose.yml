# smw_relay, the lobby and signaling server, behind Caddy, which terminates TLS (see Caddyfile and docs/guides/RELAY.md).
# Both join the external `caddy` network: docker network create caddy
# If Caddy already runs on that network, drop the caddy service and add the site block to its Caddyfile.
services:
  smw-relay:
    image: ghcr.io/kylejameswalker/supermariowar-rust-relay:latest
    restart: unless-stopped
    environment:
      SMW_RELAY_ALLOWED_ORIGINS: https://www.kylejameswalker.com
      SMW_TURN_URL: turn:smw-relay.vps.pocketsquirrel.com:3478
      SMW_TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
    networks: [caddy]

  # TURN for players whose NAT blocks a direct WebRTC connection. Needs TURN_SECRET (hex) in .env.
  coturn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --log-file=stdout
      - --external-ip=$$(detect-external-ip)
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [caddy]

networks:
  caddy:
    external: true

volumes:
  caddy_data:
  caddy_config:
