[workspace]
resolver = "2"
members = [
    "crates/smw-core",
    "crates/smw-globals",
    "crates/smw-netplay",
    "crates/smw-platform",
    "crates/smw-sdl2",
    "apps/smw",
    "apps/leveleditor",
    "apps/worldeditor",
    "apps/smw_server",
    "apps/smw_relay",
]
# Commands without -p build the game, the editors and smw_server, as before; the relay builds on its own.
default-members = [
    "crates/smw-core",
    "crates/smw-globals",
    "crates/smw-netplay",
    "crates/smw-platform",
    "crates/smw-sdl2",
    "apps/smw",
    "apps/leveleditor",
    "apps/worldeditor",
    "apps/smw_server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.dev]
opt-level = 1
overflow-checks = false

# The relay keeps Cargo's default dev profile.
[profile.dev.package.smw_relay]
overflow-checks = true
opt-level = 0

[profile.release]
overflow-checks = false

[profile.test]
overflow-checks = false
