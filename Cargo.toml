[package]
name = "smw"
version = "0.1.0"
edition = "2021"
description = "Super Mario War - faithful Rust port"

[workspace]

[features]
# Mirrors the C++ NO_NETWORK build (NetworkLayerNULL).
no_network = []
# Not in upstream: RLE off by default (SMW_RLE=1 turns it back on); see docs/sdl2-compat-rle.md.
no_rle = []

[dependencies]
sdl2 = { version = "0.37", features = ["image", "mixer"] }
toml = "0.8"

# Native only: the web build links Emscripten's zlib and plays online through smw_relay (relay/).
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
enet-sys = "1.0.5"
libz-sys = "1"

[profile.dev]
opt-level = 1
overflow-checks = false

[profile.release]
overflow-checks = false

[profile.test]
overflow-checks = false
