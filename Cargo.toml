[package]
name = "smw"
version = "0.1.0"
edition = "2021"
description = "Super Mario War - faithful Rust port"

[workspace]

[features]
# Mirrors the C++ NO_NETWORK build (NetworkLayerNULL).
no_network = []

[dependencies]
sdl2 = { version = "0.37", features = ["image", "mixer"] }
libz-sys = "1"
toml = "0.8"

# The web build is NO_NETWORK only, as upstream's.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
enet-sys = "1.0.5"

[profile.dev]
opt-level = 1
overflow-checks = false

[profile.release]
overflow-checks = false

[profile.test]
overflow-checks = false
