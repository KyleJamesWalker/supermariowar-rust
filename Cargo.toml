[package]
name = "smw"
version = "0.1.0"
edition.workspace = true
description = "Super Mario War - faithful Rust port"
publish.workspace = true

[workspace]
members = ["crates/smw-globals", "crates/smw-netplay", "crates/smw-platform", "relay"]

[workspace.package]
edition = "2021"
publish = false

[features]
# Mirrors the C++ NO_NETWORK build (NetworkLayerNULL).
no_network = []

[dependencies]
smw-globals = { path = "crates/smw-globals" }
smw-netplay = { path = "crates/smw-netplay" }
sdl2 = { version = "0.38", features = ["image", "mixer"] }
toml = "1.1"

# Native only: the web build links Emscripten's zlib and plays online through smw_relay (relay/).
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
enet-sys = "1.0.5"
smw-netplay = { path = "crates/smw-netplay", features = ["enet"] }
libz-sys = "1"

[profile.dev]
opt-level = 1
overflow-checks = false

# The relay keeps Cargo's default dev profile.
[profile.dev.package.smw_relay]
overflow-checks = true
opt-level = 0

[profile.release]
overflow-checks = false

[profile.test]
overflow-checks = false
