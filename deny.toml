[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant: ggrs 0.13 depends on it" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1: ggrs 0.13 depends on it" },
    { id = "RUSTSEC-2026-0249", reason = "smartstring: librashader 0.12 depends on it" },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11: tokio-tungstenite 0.30 depends on it, and it re-exports webpki-roots 1.x, fixed in 1.0.10" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
private = { ignore = true }
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
