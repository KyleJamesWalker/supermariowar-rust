[package]
name = "smw-peer"
version = "0.1.0"
edition.workspace = true
description = "Super Mario War - netplay v2 transport: WebRTC peers in one full-mesh room, and the GGRS socket over them"
publish.workspace = true

[dependencies]
ggrs = "=0.13.0"
bincode = "1.3"

# The web build opens its peers through web/peer_socket.js instead.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
webrtc = { version = "=0.17.2", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = "1"
bytes = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
matchbox_signaling = "=0.14.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
